# Training hyper-parameters, passed straight to ultralytics `model.train()`.
# Override any key on the command line: python src/train.py --set epochs=50 imgsz=800
#
# Defaults target an on-device phone model (see README "Mobile deployment"):
#   yolo11n @ 640  ~2.6M params, ~3 MB as int8 TFLite, real-time on recent phones
#   yolo11s @ 640  ~9.4M params, ~10 MB int8: the step up if nano confuses the scissor types
model: yolo11n.pt
data: data/yolo/data.yaml
epochs: 200              # small models need longer to converge
patience: 40
imgsz: 640               # what the app will feed in; train at the deployment resolution
batch: 32
optimizer: auto
cos_lr: true
seed: 0
deterministic: true
project: runs
name: yolo11n_640

# Augmentation. Mosaic + copy_paste synthesise cluttered, overlapping trays; the rest
# mimics hand-held phone capture (any orientation, varied scale, lighting and colour cast).
mosaic: 1.0
close_mosaic: 15
copy_paste: 0.3
mixup: 0.05              # nano has less capacity; keep this mild
degrees: 180.0           # tools appear at any orientation on a tray
flipud: 0.5
fliplr: 0.5
scale: 0.6               # phone held at different heights
translate: 0.15
perspective: 0.0005      # phone not perfectly parallel to the tray
hsv_h: 0.02
hsv_s: 0.6
hsv_v: 0.5
